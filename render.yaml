services:
  - type: web
    name: discord-music-bot
    env: node
    plan: starter
    start: npm start
    setupScript: |
      sudo apt-get update
      sudo apt-get install -y ffmpeg
      curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
      chmod a+rx /usr/local/bin/yt-dlp
    envVars:
      - key: PORT
        value: "3000"
      - key: DISCORD_TOKEN
        description: "Your Discord bot token"
      - key: DISCORD_CLIENT_ID
        value: "1552647926780534874"
      - key: DISCORD_CLIENT_SECRET
        description: "OAuth2 client secret from Discord Developer Portal"
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        description: "Public URL of this service, e.g. https://your-app.onrender.com"
    autoDeploy: true
    healthCheckPath: /health
