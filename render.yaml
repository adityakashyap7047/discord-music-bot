services:
  - type: web
    name: discord-music-bot
    env: node
    plan: starter
    start: npm start
    setupScript: |
      sudo apt-get update
      sudo apt-get install -y ffmpeg
    envVars:
      - key: DISCORD_TOKEN
        from:
          secret: discord-token
      - key: PORT
        value: "3000"
    autoDeploy: true
    healthCheckPath: /
