services:
  - type: web
    name: discord-music-bot
    runtime: node
    plan: starter
    buildCommand: npm install && curl -fL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o yt-dlp && chmod a+rx yt-dlp
    startCommand: npm start
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        value: "1552647926780534874"
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
    autoDeployTrigger: commit
    healthCheckPath: /health
